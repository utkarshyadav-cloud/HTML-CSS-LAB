<!DOCTYPE html>
<html>

<head>
    <title>First CSS Grid</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .box {
            background-color: lightblue;
            border: 2px solid navy;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>CSS Grid Example</h1>

    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>

</body>

</html>
