<!DOCTYPE html>
<html>

<head>
    <title>CSS Styling</title>

    <style>
        h1 {
            color: navy;
        }

        .highlight {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <h1>Welcome to CSS</h1>

    <p style="color: red;">
        This paragraph uses inline CSS.
    </p>

    <p class="highlight">
        This paragraph has a yellow background.
    </p>

</body>

</html>
