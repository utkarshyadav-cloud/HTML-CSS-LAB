<!DOCTYPE html>
<html>

<head>
    <title>Flexbox Wrapping Cards</title>

    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card {
            width: 180px;
            padding: 15px;
            border: 2px solid navy;
            background-color: lightblue;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Stationery Shop</h1>

    <div class="container">
        <div class="card">
            <h2>Notebook</h2>
            <p>₹60</p>
        </div>

        <div class="card">
            <h2>Pen</h2>
            <p>₹15</p>
        </div>

        <div class="card">
            <h2>Bag</h2>
            <p>₹350</p>
        </div>

        <div class="card">
            <h2>Book</h2>
            <p>₹120</p>
        </div>
    </div>

</body>

</html>
