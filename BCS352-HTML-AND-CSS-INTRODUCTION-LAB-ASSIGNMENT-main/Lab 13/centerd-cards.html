<!DOCTYPE html>
<html>

<head>
    <title>Centered Cards</title>

    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 300px;
        }

        .card {
            background-color: lightblue;
            border: 2px solid navy;
            padding: 20px;
            width: 150px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Pricing Plans</h1>

    <div class="container">
        <div class="card">
            <h2>Starter</h2>
            <p>₹199</p>
        </div>

        <div class="card">
            <h2>Standard</h2>
            <p>₹349</p>
        </div>

        <div class="card">
            <h2>Premium</h2>
            <p>₹499</p>
        </div>
    </div>

</body>

</html>
